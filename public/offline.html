<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sem conexão — Estoque Fácil PRO</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            text-align: center;
            padding: 24px;
        }
        .cartao { max-width: 360px; }
        h1 { font-size: 18px; margin: 16px 0 8px; }
        p { font-size: 14px; color: #4b5563; line-height: 1.5; margin: 0 0 20px; }
        button {
            background: #111827; color: #fff; border: none; border-radius: 6px;
            padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="cartao">
        <h1>Sem conexão com a internet</h1>
        <p>
            O Estoque Fácil PRO precisa de conexão para carregar produtos e
            registrar movimentações — os dados vivem no servidor, não neste
            aparelho. Assim que a conexão voltar, tente de novo.
        </p>
        <button onclick="location.reload()">Tentar de novo</button>
    </div>
</body>
</html>
