; Ajustes de produção — limites um pouco acima do padrão do PHP porque a
; importação de planilha (item 7 da spec) sobe um .xlsx via upload.
upload_max_filesize = 20M
post_max_size = 20M
; Importação de planilha grande é o caso extremo do app: um relatório de
; estoque real, com ~17 mil linhas, mede 208 MB de pico e 26s de execução.
; Os limites abaixo dão folga sobre isso — com 256M/60s medidos, ficaria
; sem margem para uma planilha um pouco maior.
memory_limit = 512M
max_execution_time = 180

; OPcache — validate_timestamps=0 porque o código não muda depois do
; build da imagem (cada deploy gera uma imagem nova); sem isso o OPcache
; ficaria batendo no disco pra checar timestamp de arquivo que nunca muda.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 128
